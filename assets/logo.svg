<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background: dark circle -->
  <circle cx="50" cy="50" r="48" fill="#0f172a"/>
  
  <!-- Echo ripples (memory waves radiating outward) -->
  <circle cx="50" cy="50" r="18" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.3"/>
  <circle cx="50" cy="50" r="28" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.2"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#f59e0b" stroke-width="0.7" opacity="0.12"/>
  
  <!-- Central memory core (glowing dot) -->
  <circle cx="50" cy="50" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="50" cy="50" r="5" fill="#fbbf24"/>
  
  <!-- Neural connections (memory links to agents) -->
  <line x1="50" y1="50" x2="28" y2="32" stroke="#22c55e" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="72" y2="35" stroke="#60a5fa" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="35" y2="72" stroke="#c084fc" stroke-width="1.5" opacity="0.7"/>
  <line x1="50" y1="50" x2="70" y2="68" stroke="#f472b6" stroke-width="1.5" opacity="0.7"/>
  
  <!-- Agent nodes -->
  <circle cx="28" cy="32" r="4" fill="#22c55e"/>
  <circle cx="72" cy="35" r="4" fill="#60a5fa"/>
  <circle cx="35" cy="72" r="4" fill="#c084fc"/>
  <circle cx="70" cy="68" r="4" fill="#f472b6"/>
  
  <!-- Outer ring (containment/structure) -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#f59e0b" stroke-width="1.5" opacity="0.5" stroke-dasharray="4,3"/>
</svg>
